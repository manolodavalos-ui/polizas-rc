# Firebase App Hosting. Los valores salen de Configuración del proyecto > Tus apps > App web.
# Son públicos (la seguridad está en firestore.rules y storage.rules).
runConfig:
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: PENDIENTE
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: PENDIENTE
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: PENDIENTE
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: PENDIENTE
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: PENDIENTE
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: PENDIENTE
